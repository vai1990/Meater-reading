name: Publish Precompiled Debug APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'apk-distribution/app-debug.apk'
      - 'apk-distribution/app-debug.apk.sha256'
      - '.github/workflows/publish-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate precompiled APK and SHA-256 checksum
        id: validate_apk
        run: |
          set -euo pipefail

          APK_FILE="apk-distribution/app-debug.apk"
          SHA_FILE="apk-distribution/app-debug.apk.sha256"

          if [ ! -f "$APK_FILE" ]; then
            echo "ERROR: Precompiled APK not found at $APK_FILE"
            exit 1
          fi

          if [ ! -s "$APK_FILE" ]; then
            echo "ERROR: Precompiled APK at $APK_FILE is empty"
            exit 1
          fi

          if [ ! -f "$SHA_FILE" ] || [ ! -s "$SHA_FILE" ]; then
            echo "ERROR: Checksum file missing or empty at $SHA_FILE"
            exit 1
          fi

          EXPECTED_SHA=$(awk '{print $1}' "$SHA_FILE" | tr -d '\r\n')
          ACTUAL_SHA=$(sha256sum "$APK_FILE" | awk '{print $1}')

          if [ -z "$EXPECTED_SHA" ] || [ "$EXPECTED_SHA" != "$ACTUAL_SHA" ]; then
            echo "ERROR: SHA-256 checksum mismatch!"
            echo "Expected: $EXPECTED_SHA"
            echo "Actual:   $ACTUAL_SHA"
            exit 1
          fi

          if ! unzip -tq "$APK_FILE"; then
            echo "ERROR: APK archive structure validation (unzip -tq) failed."
            exit 1
          fi

          APK_BYTES=$(wc -c < "$APK_FILE" | tr -d ' ')
          APK_HUMAN_SIZE=$(du -h "$APK_FILE" | awk '{print $1}')

          echo "sha256=${ACTUAL_SHA}" >> "$GITHUB_OUTPUT"
          echo "size_bytes=${APK_BYTES}" >> "$GITHUB_OUTPUT"
          echo "size_human=${APK_HUMAN_SIZE}" >> "$GITHUB_OUTPUT"
          echo "Validated $APK_FILE (${APK_HUMAN_SIZE}, ${APK_BYTES} bytes, SHA-256: ${ACTUAL_SHA})"

      - name: Create GitHub Release and upload app-debug.apk
        id: publish_release
        env:
          GH_TOKEN: ${{ github.token }}
          APK_SHA256: ${{ steps.validate_apk.outputs.sha256 }}
          APK_SIZE_BYTES: ${{ steps.validate_apk.outputs.size_bytes }}
          APK_SIZE_HUMAN: ${{ steps.validate_apk.outputs.size_human }}
        run: |
          set -euo pipefail

          APK_FILE="apk-distribution/app-debug.apk"
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"

          RELEASE_NOTES=$(cat <<EOF
          Precompiled Android Debug APK (compiled and verified in Google AI Studio).

          - **Release Tag:** \`${RELEASE_TAG}\`
          - **Asset Filename:** \`app-debug.apk\`
          - **APK Size:** ${APK_SIZE_HUMAN} (${APK_SIZE_BYTES} bytes)
          - **SHA-256:** \`${APK_SHA256}\`
          - **Direct Download (Latest):** ${DIRECT_URL}
          EOF
          )

          gh release create "$RELEASE_TAG" "$APK_FILE#app-debug.apk" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "$GITHUB_SHA" \
            --latest

          RELEASE_PAGE_URL=$(gh release view "$RELEASE_TAG" --json url --jq '.url')

          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_url=${RELEASE_PAGE_URL}" >> "$GITHUB_OUTPUT"
          echo "direct_url=${DIRECT_URL}" >> "$GITHUB_OUTPUT"

      - name: Write Release Summary
        if: success()
        env:
          RELEASE_TAG: ${{ steps.publish_release.outputs.release_tag }}
          RELEASE_URL: ${{ steps.publish_release.outputs.release_url }}
          DIRECT_URL: ${{ steps.publish_release.outputs.direct_url }}
          APK_SHA256: ${{ steps.validate_apk.outputs.sha256 }}
          APK_SIZE_BYTES: ${{ steps.validate_apk.outputs.size_bytes }}
          APK_SIZE_HUMAN: ${{ steps.validate_apk.outputs.size_human }}
        run: |
          set -euo pipefail

          echo "Release Tag: ${RELEASE_TAG}"
          echo "APK Size: ${APK_SIZE_HUMAN} (${APK_SIZE_BYTES} bytes)"
          echo "SHA-256: ${APK_SHA256}"
          echo "GitHub Release Page: ${RELEASE_URL}"
          echo "Direct Latest-Release APK Download URL: ${DIRECT_URL}"

          {
            echo "## Precompiled Android APK Published"
            echo ""
            echo "| Property | Value |"
            echo "| :--- | :--- |"
            echo "| **Release Tag** | \`${RELEASE_TAG}\` |"
            echo "| **APK Size** | ${APK_SIZE_HUMAN} (${APK_SIZE_BYTES} bytes) |"
            echo "| **SHA-256 Checksum** | \`${APK_SHA256}\` |"
            echo "| **GitHub Release Page** | ${RELEASE_URL} |"
            echo "| **Direct Latest APK Download URL** | ${DIRECT_URL} |"
          } >> "$GITHUB_STEP_SUMMARY"
